# Image processing pipeline configuration.
# Uses only implemented operations.

global:
  logging_level: info
  temp_dir: ./temp/image_processing
  cache_dir: ./cache/image_processing

data:
  input_path: ./data/input/images
  output_path: ./data/output/images_processed
  modalities:
    - image

resources:
  cpu: 2
  memory: 2GB

pipeline:
  operations:
    # 1. Load image data
    - name: image_loading
      params:
        data_paths:
          - ./data/input/images
        modalities:
          - image
        supported_formats:
          - jpg
          - jpeg
          - png

    # 2. Filter by image size (implemented)
    - name: image_size_filter
      params:
        min_width: 100
        min_height: 100

    # 3. Filter by image aspect ratio (implemented)
    - name: image_aspect_ratio_filter
      params:
        min_ratio: 0.5
        max_ratio: 2.0

    # 4. Filter NSFW content (implemented)
    - name: image_nsfw_filter
      params:
        threshold: 0.7

    # 5. Save processed images
    - name: image_saving
      params:
        output_path: ./data/output/images_processed
        format: parquet
